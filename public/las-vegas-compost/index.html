<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: owner = sidebar + work area on desktop, top bar + bottom tabs on phones; driver = one phone-width column with a sticky action bar. */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --surface-2:#E8EDE4; --ink:#152018; --muted:#5B685E; --line:#D3DBCF;
  --brand:#2C6B3E; --brand-strong:#1F5230; --on-brand:#FFFFFF; --brand-soft:#DCEADB;
  --amber:#9A6500; --amber-fill:#E9A93A; --amber-soft:#FCEBC4; --amber-line:#E5BE62;
  --clay:#A5412A; --clay-soft:#F7DDD5; --clay-line:#E2A08F;
  --sky:#2A6585; --sky-soft:#DDEAF1;
  --map-bg:#E6ECE1; --map-grid:#D6DED0; --map-road:#C5D0BE;
  --shadow:0 1px 2px rgba(21,32,24,.06),0 6px 20px rgba(21,32,24,.07);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1511; --surface:#161E18; --surface-2:#1F2922; --ink:#E6ECE4; --muted:#9AA79C; --line:#2B372E;
    --brand:#5DB676; --brand-strong:#7CC98F; --on-brand:#0C1810; --brand-soft:#1C3223;
    --amber:#F2BA4C; --amber-fill:#E9A93A; --amber-soft:#382A0E; --amber-line:#6F5519;
    --clay:#EE8C71; --clay-soft:#3A1F18; --clay-line:#6E3628;
    --sky:#82BCD9; --sky-soft:#15303C;
    --map-bg:#131B15; --map-grid:#1C2720; --map-road:#25322A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#161E18; --surface-2:#1F2922; --ink:#E6ECE4; --muted:#9AA79C; --line:#2B372E;
  --brand:#5DB676; --brand-strong:#7CC98F; --on-brand:#0C1810; --brand-soft:#1C3223;
  --amber:#F2BA4C; --amber-fill:#E9A93A; --amber-soft:#382A0E; --amber-line:#6F5519;
  --clay:#EE8C71; --clay-soft:#3A1F18; --clay-line:#6E3628;
  --sky:#82BCD9; --sky-soft:#15303C;
  --map-bg:#131B15; --map-grid:#1C2720; --map-road:#25322A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,34px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* demo banner */
.demo-banner{background:var(--ink);color:var(--bg);font-size:13px;padding-block:7px;padding-top:calc(7px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.demo-banner a{color:inherit;font-weight:700}
.demo-banner .short{display:none}
@media (max-width:720px){.demo-banner{font-size:12px;gap:8px;flex-wrap:nowrap;justify-content:space-between;text-align:left}.demo-banner .long{display:none}.demo-banner .short{display:inline}.demo-banner button{flex:none}}
.demo-banner button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:inherit;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100% - 36px)}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--display);font-weight:800;font-size:16.5px;line-height:1.05}
.brand-sub{font-size:12px;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong)}
.nav svg{width:19px;height:19px;flex:none}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.credit{font-size:12px;color:var(--muted);padding:0 6px}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.main{min-width:0;padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}
.tabs{display:none}

@media (max-width:899px){
  .shell{display:block}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;justify-content:space-between;gap:10px}
  .topbar .brand{padding:0}
  .topbar .brand-mark{width:32px;height:32px}
  .topbar .brand-name{font-size:15px}
  .topbar .seg button{padding:6px 9px;font-size:12.5px}
  .main{padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabs.on{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;padding:4px 0;position:relative}
  .tabs a svg{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--brand-strong)}
  .tabs .dot{position:absolute;top:2px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--clay)}
}
body.driver-mode .shell{display:block}
body.driver-mode .side{display:none}
body.driver-mode .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;justify-content:space-between;gap:10px}
body.driver-mode .topbar .brand{padding:0}
body.driver-mode .main{padding-block:18px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.driver-mode .wrap{max-width:540px;gap:16px}
body.driver-mode .tabs{display:none!important}

/* common blocks */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-head .lede{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.big{min-height:54px;font-size:16px;border-radius:14px;padding:12px 18px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.6;border:1px solid transparent}
.chip svg{width:13px;height:13px}
.chip.new{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.chip.final{background:var(--clay-soft);color:var(--clay);border-color:var(--clay-line)}
.chip.ok{background:var(--brand-soft);color:var(--brand-strong)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.chip.sky{background:var(--sky-soft);color:var(--sky)}
.chip.gate{background:var(--surface-2);color:var(--ink);font-family:var(--mono);font-weight:600}
.badge{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--clay);color:#fff;font-size:11.5px;font-weight:800;align-items:center;justify-content:center}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ready{background:var(--surface-2);color:var(--muted)}
.pill.active{background:var(--sky-soft);color:var(--sky)}
.pill.done{background:var(--brand-soft);color:var(--brand-strong)}
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.avatar.lg{width:46px;height:46px;font-size:16px}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress > span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats > div{background:var(--surface);padding:14px 16px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.divider{height:1px;background:var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.link{color:var(--brand-strong);font-weight:700;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.back-link{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.back-link svg{width:18px;height:18px}
@media (min-width:900px){.map-sticky{position:sticky;top:20px}}

/* route cards */
.route-card{display:flex;flex-direction:column;gap:14px;padding:18px;text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.route-card:hover{transform:translateY(-1px)}
.route-card .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.route-card .meta b{color:var(--ink)}
.route-flags{display:flex;gap:6px;flex-wrap:wrap}

/* map */
.map{width:100%;height:auto;display:block;border-radius:var(--r-sm);background:var(--map-bg)}
.map text{font-family:var(--mono);font-weight:600}
.map-wrap{position:relative}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.map-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--brand);background:var(--surface)}
.map-legend i.n{border-color:var(--amber);background:var(--amber-soft)}
.map-legend i.f{border-color:var(--clay);background:var(--clay-soft)}
.map-legend i.d{background:var(--brand);border-color:var(--brand)}

/* stop list */
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--brand-strong);background:var(--surface)}
.stop.t-new{background:color-mix(in srgb,var(--amber-soft) 55%,transparent)}
.stop.t-new .n{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.stop.t-final{background:color-mix(in srgb,var(--clay-soft) 55%,transparent)}
.stop.t-final .n{border-color:var(--clay);color:var(--clay);background:var(--clay-soft)}
.stop.s-done .n{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stop.s-issue .n{background:var(--clay);border-color:var(--clay);color:#fff}
.stop.endpoint .n{border-radius:8px;border-color:var(--ink);background:var(--ink);color:var(--bg)}
.stop .who{font-weight:700}
.stop .addr{color:var(--muted);font-size:13.5px}
.stop .extra{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stop .note{font-size:13px;color:var(--ink);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.stop .note svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--muted)}
.stop .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12.5px;color:var(--muted)}
@media (max-width:440px){
  .stop{grid-template-columns:30px minmax(0,1fr);column-gap:10px;padding:12px 14px}
  .stop .right{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}
  .stop .right:empty{display:none}
}
.driver-pick .pill{white-space:normal}
.now-btns{display:flex;flex-wrap:wrap;gap:8px}
.now-btns > *{flex:1 1 130px}
.thumb{width:46px;height:36px;border-radius:7px;object-fit:cover;cursor:zoom-in;border:1px solid var(--line)}
.select-sm{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:12.5px;font-weight:600}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .label{font-size:13px;font-weight:700}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,.textarea,.select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;min-height:44px}
.textarea{min-height:84px;resize:vertical;line-height:1.45}
.input.mono{font-family:var(--mono);letter-spacing:.04em}
.input:focus,.textarea:focus,.select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.typepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.typepick label{border:1.5px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:700}
.typepick label small{font-weight:500;color:var(--muted);font-size:12px;line-height:1.3}
.typepick input{position:absolute;opacity:0;pointer-events:none}
.typepick label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.typepick label.k-new:has(input:checked){border-color:var(--amber);background:var(--amber-soft)}
.typepick label.k-final:has(input:checked){border-color:var(--clay);background:var(--clay-soft)}
@media (max-width:480px){.typepick{grid-template-columns:1fr}}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search .input{padding-left:38px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* customer table */
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.crow:hover{background:var(--surface-2)}
.crow:first-child{border-top:0}
.crow .sub{font-size:13px;color:var(--muted)}
.crow .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.crow{grid-template-columns:minmax(0,1fr) auto}.crow .route-col{display:none}
  .clist .crow{grid-template-columns:minmax(0,1fr);gap:6px}.clist .crow .tags{justify-content:flex-start}.clist .crow .tags:empty{display:none}}

/* texts */
.bubble{background:var(--surface-2);border-radius:18px 18px 18px 6px;padding:10px 13px;font-size:14.5px;line-height:1.4;max-width:340px;white-space:pre-wrap;word-break:break-word}
.bubble a,.bubble .plink{color:var(--sky);text-decoration:underline;cursor:pointer}
.phone-preview{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.phone-preview .from{font-size:11.5px;color:var(--muted);font-weight:700;text-align:center}
.log{display:flex;flex-direction:column}
.log-item{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.log-item:first-child{border-top:0}
.log-item time{font-size:12.5px;color:var(--muted);font-weight:600;padding-top:2px}
.log-item .to{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1;margin:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle input:checked + span{background:var(--brand)}
.toggle input:checked + span::after{transform:translateX(18px)}
.radio-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer}
.radio-row:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.radio-row input{margin-top:3px;accent-color:var(--brand)}

/* driver */
.driver-pick{display:flex;flex-direction:column;gap:10px}
.driver-pick button{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;cursor:pointer;width:100%}
.driver-pick .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.driver-pick .who b{font-size:16px;line-height:1.25}
.driver-pick .who .sub{font-size:13.5px;color:var(--muted)}
.driver-pick .go{width:20px;height:20px;flex:none;color:var(--muted)}
@media (hover:hover){.driver-pick button:hover{border-color:var(--brand)}}
.alert-buckets{border:2px solid var(--amber-line);background:var(--amber-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.alert-buckets .big{display:flex;gap:12px;align-items:center}
.alert-buckets .big svg{width:38px;height:38px;color:var(--amber);flex:none}
.alert-buckets h2{color:var(--amber);font-size:22px}
.alert-buckets ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.alert-buckets li{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.check-row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--amber-line);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700}
.check-row input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.final-note{border:1.5px solid var(--clay-line);background:var(--clay-soft);color:var(--clay);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.final-note svg{width:20px;height:20px;flex:none;margin-top:1px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-inner{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock .hint{font-size:12.5px;color:var(--muted);text-align:center;font-weight:600}
.now-card{border:2px solid var(--brand);border-radius:18px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.now-card.t-new{border-color:var(--amber)}
.now-card.t-final{border-color:var(--clay)}
.now-top{padding:16px;display:flex;flex-direction:column;gap:10px}
.now-type{padding:10px 16px;font-weight:800;font-size:13.5px;letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.now-type svg{width:18px;height:18px}
.now-type.regular{background:var(--brand-soft);color:var(--brand-strong)}
.now-type.new{background:var(--amber-soft);color:var(--amber)}
.now-type.final{background:var(--clay-soft);color:var(--clay)}
.now-name{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.now-addr{font-size:15.5px;color:var(--muted);font-weight:600}
.infobox{border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
.infobox svg{width:18px;height:18px;flex:none;margin-top:2px}
.infobox .lbl{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.infobox.gate{background:var(--ink);color:var(--bg)}
.infobox.gate .code{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:.06em;line-height:1.2}
.infobox.notes{background:var(--sky-soft);color:var(--ink)}
.infobox.notes .lbl{color:var(--sky)}
.infobox.notes svg{color:var(--sky)}
.photo-drop{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.photo-drop img{border-radius:10px;width:100%;max-height:260px;object-fit:cover}
.photo-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.photo-btns .btn{white-space:normal;text-align:center;line-height:1.2;padding-inline:10px}
.up-next .stop{cursor:pointer}
.done-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 18px}
.done-hero .seal{width:72px;height:72px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center}
.done-hero .seal svg{width:38px;height:38px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}

.confirm.fresh{background:color-mix(in srgb,var(--brand-soft) 60%,transparent)}

.scrim{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}

.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease-out;pointer-events:auto}
.toast svg{width:18px;height:18px;flex:none;margin-top:2px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.picker{display:flex;flex-direction:column;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.picker label{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.picker label:first-child{border-top:0}
.picker input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.picker .sub{font-size:12.5px;color:var(--muted)}
.kbd-tip{font-size:12.5px;color:var(--muted)}
.welcome{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:stretch}

.howto{display:flex;flex-direction:column;gap:10px;padding:18px}

/* ---------- geometry ---------- */
function hav(a, b){
  const R = 3958.8, toR = Math.PI/180;
  const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*toR) * Math.cos(b.lat*toR) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const ROAD = 1.32; // straight-line miles to driving miles
function startPoint(s, driverId){
  const d = s.drivers[driverId]; if(!d) return s.facility;
  return d.start.kind === "facility" ? s.facility : d.start;
}
function startLabel(s, driverId){
  const d = s.drivers[driverId]; if(!d) return "Facility";
  if(d.start.kind === "facility") return "Starts at the facility";
  return (d.owner ? "Your" : firstName(d.name) + "'s") + " home · " + d.start.address;
}
function routePoints(s, route, driverId){
  const st = startPoint(s, driverId || route.driverId);
  return [st, ...route.stops.map(x => s.customers[x.cid]), s.facility];
}
function routeMiles(s, route, driverId){
  const p = routePoints(s, route, driverId); let m = 0;
  for(let i=1;i<p.length;i++) m += hav(p[i-1], p[i]);
  return m * ROAD;
}
function optimizeRoute(s, route){
  const start = startPoint(s, route.driverId), end = s.facility;
  const fixed = route.stops.filter(x => x.status !== "pending");
  const free = route.stops.filter(x => x.status === "pending");
  let cur = fixed.length ? s.customers[fixed[fixed.length-1].cid] : start;
  const left = free.slice(), order = [];
  while(left.length){
    let bi = 0, bd = Infinity;
    left.forEach((x, i) => { const d = hav(cur, s.customers[x.cid]); if(d < bd){ bd = d; bi = i; } });
    cur = s.customers[left[bi].cid]; order.push(left.splice(bi,1)[0]);
  }
  const P = x => s.customers[x.cid];
  const anchor = fixed.length ? P(fixed[fixed.length-1]) : start;
  let improved = true, guard = 0;
  while(improved && guard++ < 60){
    improved = false;
    for(let i=0;i<order.length-1;i++){
      for(let k=i+1;k<order.length;k++){
        const a = i === 0 ? anchor : P(order[i-1]), b = P(order[i]), c = P(order[k]), d = k === order.length-1 ? end : P(order[k+1]);
        if(hav(a,c) + hav(b,d) < hav(a,b) + hav(c,d) - 1e-9){
          order.splice(i, k-i+1, ...order.slice(i, k+1).reverse()); improved = true;
        }
      }
    }
  }
  route.stops = fixed.concat(order);
}

/* ---------- map ---------- */
function projector(bounds, w, h, m){
  const cosLat = Math.cos(((bounds.minLat + bounds.maxLat)/2) * Math.PI/180);
  const dx = (bounds.maxLng - bounds.minLng) * cosLat || 0.01, dy = (bounds.maxLat - bounds.minLat) || 0.01;
  const sc = Math.min((w - 2*m)/dx, (h - 2*m)/dy);
  const ox = (w - dx*sc)/2, oy = (h - dy*sc)/2;
  return {
    p: (lat, lng) => [ox + (lng - bounds.minLng)*cosLat*sc, oy + (bounds.maxLat - lat)*sc],
    inv: (x, y) => ({lat: bounds.maxLat - (y - oy)/sc, lng: bounds.minLng + (x - ox)/(cosLat*sc)})
  };
}
function boundsOf(pts, pad){
  let a = {minLat:90, maxLat:-90, minLng:180, maxLng:-180};
  pts.forEach(p => { a.minLat = Math.min(a.minLat, p.lat); a.maxLat = Math.max(a.maxLat, p.lat); a.minLng = Math.min(a.minLng, p.lng); a.maxLng = Math.max(a.maxLng, p.lng); });
  const pl = (a.maxLat - a.minLat) * pad + 0.003, pg = (a.maxLng - a.minLng) * pad + 0.003;
  return {minLat:a.minLat-pl, maxLat:a.maxLat+pl, minLng:a.minLng-pg, maxLng:a.maxLng+pg};
}
function gridLines(bounds, P, w, h){
  let out = "";
  const step = 0.0075;
  for(let lat = Math.ceil(bounds.minLat/step)*step; lat < bounds.maxLat; lat += step){
    const [, y] = P.p(lat, bounds.minLng); const major = Math.abs(Math.round(lat/step) % 4) === 0;
    out += `<line x1="0" x2="${w}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(${major?"--map-road":"--map-grid"})" stroke-width="${major?3:1}"/>`;
  }
  for(let lng = Math.ceil(bounds.minLng/step)*step; lng < bounds.maxLng; lng += step){
    const [x] = P.p(bounds.minLat, lng); const major = Math.abs(Math.round(lng/step) % 4) === 0;
    out += `<line y1="0" y2="${h}" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" stroke="var(${major?"--map-road":"--map-grid"})" stroke-width="${major?3:1}"/>`;
  }
  return out;
}

  paths += `<polyline points="${seg(doneCount, lastStopIdx)}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-opacity=".55" stroke-dasharray="${route.status==="ready"?"0":"7 6"}" stroke-linejoin="round" stroke-linecap="round"/>`;

}

  if(OWNER_TABS.some(t => t[0] === h)) return {mode:"owner", tab:h};
  return {mode:"owner", tab:"today"};
}
function renderShell(v){
  document.body.classList.toggle("driver-mode", v.mode === "driver");
  $$("[data-brand]").forEach(el => el.innerHTML = `${BRAND_MARK}<div><div class="brand-name">Las Vegas Compost</div><div class="brand-sub">${v.mode === "driver" ? "Driver app" : "Routes & texts"}</div></div>`);
  $$("[data-role-switch]").forEach(el => el.innerHTML = `<button type="button" data-act="role" data-role="owner" aria-pressed="${v.mode==="owner"}">Owner</button><button type="button" data-act="role" data-role="driver" aria-pressed="${v.mode==="driver"}">Driver</button>`);
  const n = unseen();
  $("[data-nav]").innerHTML = OWNER_TABS.map(([id, label, icon]) => `<a href="#${id}" ${v.tab===id?'aria-current="page"':""}>${ic(icon)}${label}${id==="today" && n>0 ? `<span class="badge">${n}</span>` : ""}</a>`).join("");
  const tabs = $("[data-tabs]");
  tabs.classList.toggle("on", v.mode === "owner");
  tabs.innerHTML = OWNER_TABS.map(([id, label, icon]) => `<a href="#${id}" ${v.tab===id?'aria-current="page"':""}>${ic(icon)}${label}${id==="today" && n>0 ? '<i class="dot"></i>' : ""}</a>`).join("");
}
function render(){
  const v = currentView();
  renderShell(v);
  const el = $("#view");
  let html = "";
  if(v.mode === "driver") html = viewDriver();
  else if(v.route) html = viewRoute(v.route);
  else html = ({today:viewToday, routes:viewRoutes, customers:viewCustomers, drivers:viewDrivers, texts:viewTexts})[v.tab]();
  el.innerHTML = html;
  if(v.mode === "owner" && v.tab === "today" && unseen() > 0){ /* marked seen after first render */ setTimeout(() => { S.seenConfirmations = S.confirmations.length; save(); renderShell(currentView()); }, 2500); }
}

/* ---------- owner: today ---------- */
function viewToday(){
  const routes = S.routeList.map(R);
  const tot = routes.reduce((a, rt) => { const c = routeCounts(rt); a.stops += c.total; a.done += c.handled; a.mi += routeMiles(S, rt); a.newb += c.new; return a; }, {stops:0, done:0, mi:0, newb:0});

  const hr = d.getHours(); const greet = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";

  const fresh = unseen();
  return `
  <div class="page-head">
    <div><p class="eyebrow">${d.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"})}</p><h1>${greet}, Yusuf</h1><p class="lede">${routes.length} routes going out today. Here's where everyone is.</p></div>
    <a class="btn" href="#driver">${ic("truck")}Open the driver app</a>
  </div>
  <div class="stats">
    <div class="stat"><b class="num">${tot.done}<span class="muted" style="font-size:16px"> / ${tot.stops}</span></b><span>Stops done today</span></div>
    <div class="stat"><b class="num">${fmtMi(tot.mi)}</b><span>Planned miles</span></div>
    <div class="stat"><b class="num">${tot.newb}</b><span>New buckets going out</span></div>
    <div class="stat"><b class="num">${S.texts.filter(t => t.kind !== "reminder-batch" && new Date(t.at).toDateString() === d.toDateString()).length}</b><span>Texts sent today</span></div>
  </div>
  ${fresh > 0 ? `<div class="card" style="border-color:var(--brand)"><div class="pad row between wrapflex"><div class="row">${ic("check")}<b>${fresh} new route confirmation${fresh>1?"s":""}</b></div><button type="button" class="link" data-act="scroll-to" data-target="confirmations">See below</button></div></div>` : ""}
  <section class="stack">
    <div class="section-title"><h2>Today's routes</h2><a class="link" href="#routes">Manage routes</a></div>
    <div class="grid-3">
      ${routes.map(rt => {
        const c = routeCounts(rt), dr = S.drivers[rt.driverId];
        return `<a class="card route-card" href="#route-${rt.id}">
          <div class="stack" style="gap:8px;align-items:flex-start"><h3>${esc(rt.name)}</h3>${routeStatusPill(rt)}</div>
          <div class="row">${avatar(dr)}<div><b>${esc(dr.name)}</b><div class="muted" style="font-size:13px">${esc(startLabel(S, rt.driverId))}</div></div></div>
          <div class="progress" aria-label="${c.handled} of ${c.total} stops done"><span style="width:${c.total ? (c.handled/c.total*100) : 0}%"></span></div>
          <div class="meta"><span><b class="num">${c.handled}/${c.total}</b> stops</span><span><b class="num">${fmtMi(routeMiles(S, rt))}</b> mi</span>${c.issue?`<span style="color:var(--clay)"><b>${c.issue}</b> issue</span>`:""}</div>
          <div class="route-flags">${c.new ? `<span class="chip new">${ic("bucket")}${c.new} new bucket${c.new>1?"s":""}</span>` : ""}${c.final ? `<span class="chip final">${ic("flag")}${c.final} final pickup${c.final>1?"s":""}</span>` : ""}</div>
        </a>`;
      }).join("")}
    </div>
  </section>
  <div class="grid-2">
    <section class="card" id="confirmations">
      <div class="pad section-title"><h2>Route confirmations</h2><span class="muted" style="font-size:13px">Sent when a driver ends a route</span></div>
      <div class="divider"></div>
      ${confirmationsList()}
    </section>
    <section class="stack">
      <div class="card reminder-card">
        <div class="clock">${ic("clock")}</div>
        <div style="flex:1;min-width:0"><b>Pickup reminders go out at ${fmtClock(S.settings.reminderTime)} the night before</b><div class="muted" style="font-size:13.5px">${S.settings.reminderOn ? "On · last batch went to " + (S.texts.find(t => t.kind==="reminder-batch")||{count:0}).count + " customers" : "Turned off"}</div></div>
        <a class="btn sm" href="#texts">Edit</a>
      </div>
      <div class="card">
        <div class="pad section-title"><h2>Latest texts</h2><a class="link" href="#texts">All texts</a></div>
        <div class="divider"></div>
        <div class="log">${recentTexts.map(textRow).join("")}</div>
      </div>

  </div>`;
}
function fmtClock(hhmm){ const [h, m] = hhmm.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return fmtTime(d); }
function confirmationsList(){
  const items = [];
  S.confirmations.slice().reverse().forEach((c, i) => items.push({...c, fresh: i < unseen()}));
  S.history.slice().sort((a,b) => b.date - a.date).forEach(h => items.push(h));
  if(!items.length) return `<div class="empty">No routes finished yet today.</div>`;
  return items.slice(0, 5).map(c => {
    const dr = S.drivers[c.driverId] || {name:"Driver", color:"#666"};
    const photos = c.livePhotos
      ? c.livePhotos.map(p => ({src: photoSrc(p.photo, stampFor(S, p.cid, p.at)), cap: ((S.customers[p.cid]||{}).name || "Stop") + " · " + ((S.customers[p.cid]||{}).address || "")}))
      : (c.photos || []).map((seed, i) => ({src: samplePhoto(seed, "Sample photo"), cap: c.routeName + " · stop " + (i+1)}));
    return `<div class="confirm${c.fresh?" fresh":""}">
      <div class="row between wrapflex"><div class="row">${avatar(dr)}<div><b>${esc(firstName(dr.name))} finished ${esc(c.routeName)}</b><div class="muted" style="font-size:13px">${new Date(c.date).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"})}${c.endedAt ? " · ended " + fmtTime(c.endedAt) : ""}</div></div></div>${c.fresh?'<span class="chip ok">New</span>':""}</div>
      <div class="row wrapflex" style="gap:16px;font-size:13.5px"><span><b class="num">${c.ok}/${c.total}</b> serviced</span><span><b class="num">${fmtMi(c.miles)}</b> mi</span>${c.issues?`<span style="color:var(--clay)"><b>${c.issues}</b> couldn't be serviced</span>`:""}<span class="muted">Dumped at facility</span></div>
      ${photos.length ? `<div class="photo-strip">${photos.slice(0, 8).map(p => `<img src="${p.src}" alt="${esc(p.cap)}" data-act="zoom" data-cap="${esc(p.cap)}">`).join("")}</div>` : ""}
    </div>`;
  }).join("");
}
function textRow(t){
  if(t.kind === "reminder-batch") return `<div class="log-item"><time>${fmtTime(t.at)}</time><div><div class="to">Pickup reminder <span class="chip sky">Sent to ${t.count} customers</span></div><div class="bubble">${esc(t.body)}</div></div></div>`;
  if(t.kind === "owner") return `<div class="log-item"><time>${fmtTime(t.at)}</time><div><div class="to">To you (Yusuf) <span class="chip ok">Route confirmation</span></div><div class="bubble">${esc(t.body)}</div></div></div>`;
  if(t.kind === "issue") return `<div class="log-item"><time>${fmtTime(t.at)}</time><div><div class="to">To you (Yusuf) <span class="chip final">Driver note</span></div><div class="bubble">${esc(t.body)}</div></div></div>`;
  const c = S.customers[t.cid] || {name:"Customer", phone:""};
  const label = {onway:"On the way", serviced:"Serviced", dropoff:"New bucket", final:"Final pickup"}[t.kind] || "Text";
  const chipCls = {onway:"sky", serviced:"ok", dropoff:"new", final:"final"}[t.kind] || "neutral";
  let body = esc(t.body);
  if(t.photo){ const lnk = photoLink(t.photo); body = body.replace(esc(lnk), `<span class="plink" data-act="zoom-photo" data-text="${t.id}">${esc(lnk)}</span>`); }
  return `<div class="log-item"><time>${fmtTime(t.at)}</time><div><div class="to">${esc(c.name)} <span class="muted" style="font-weight:500">${esc(c.phone)}</span> <span class="chip ${chipCls}">${label}</span></div><div class="bubble">${body}</div></div></div>`;

function driverDone(rt){

/* ---------- toasts / drawer / lightbox ---------- */
function toast(title, body, icon="chat"){

    <form class="drawer-body" data-form="add-stops" data-id="${rt.id}" id="as-form"><p class="hint">Customers move from their current route. The order is re-planned for the shortest drive${rt.status!=="ready"?" (only stops not done yet)":""}.</p>
    <div class="picker">${options.map(c => { const o = S.routes[c.routeId]; const lock = o && o.status !== "ready"; return `<label><input type="checkbox" name="stops" value="${c.id}" ${lock?"disabled":""}><div><div>${esc(c.name)}</div><div class="sub">${esc(c.address)} · ${o?esc(o.name):"No route"}${lock?" (underway)":""}</div></div></label>`; }).join("")}</div>
    <button class="btn" type="button" data-act="new-customer" data-route="${rt.id}">${ic("plus")}New customer instead</button></form>
    <div class="drawer-foot"><button class="btn" type="button" data-act="close-drawer">Cancel</button><button class="btn primary" type="submit" form="as-form">Add stops</button></div>`);
  },
  "edit-customer"(el, e){ if(e) e.stopPropagation(); const c = S.customers[el.dataset.cid]; openDrawer(customerForm(c, false)); },
  "new-customer"(el){ const rid = (el && el.dataset.route) || S.routeList[0]; openDrawer(customerForm({id:"", name:"", phone:"", address:"", city:"Las Vegas", gate:"", notes:"", freq:"Weekly", routeId: rid}, true)); },
  "remove-customer"(el){
    const btn = el;
    if(btn.dataset.confirm !== "1"){ btn.dataset.confirm = "1"; btn.innerHTML = ic("trash") + "Tap again to remove"; return; }
    const c = S.customers[el.dataset.cid]; const rt = S.routes[c.routeId];
    if(rt) rt.stops = rt.stops.filter(x => x.cid !== c.id);
    delete S.customers[c.id]; save(); closeDrawer(); render(); toast("Customer removed", c.name + " is off " + (rt ? rt.name : "their route") + ".", "trash");
  },
  "cust-filter"(el){ custFilter = el.dataset.f; render(); },
  "edit-driver"(el){ openDrawer(driverForm(S.drivers[el.dataset.id])); },
  "pick-start"(el, e){
    const svg = el.closest("svg"); const rect = svg.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * 640, y = (e.clientY - rect.top) / rect.height * 420;
    const P = projector(VALLEY, 640, 420, 14); const ll = P.inv(x, y);
    const form = $("#drv-form"); form.lat.value = ll.lat.toFixed(5); form.lng.value = ll.lng.toFixed(5);
    form.querySelector('input[name="kind"][value="home"]').checked = true;
    const id = el.closest("svg").dataset.driver; const d = S.drivers[id];
    const tmp = JSON.parse(JSON.stringify(d)); tmp.start = {kind:"home", address: form.address.value || "Pinned location", city: form.city.value, lat: ll.lat, lng: ll.lng};
    const keep = S.drivers[id]; S.drivers[id] = tmp; $("#valley-map").innerHTML = valleyMap(id); S.drivers[id] = keep;
  },
  "mileage-csv"(){
    const rows = [["Date","Driver","Route","Stops serviced","Total stops","Miles"]];
    S.history.concat(S.confirmations).sort((a,b) => a.date - b.date).forEach(h => rows.push([new Date(h.date).toLocaleDateString(), (S.drivers[h.driverId]||{}).name, h.routeName, h.ok, h.total, fmtMi(h.miles)]));
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = "lv-compost-mileage.csv"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast("Mileage log downloaded", rows.length - 1 + " routes", "download");
  },
  "send-reminders"(){
    const n = S.routeList.reduce((a, id) => a + R(id).stops.length, 0);
    S.texts.push({id:uid(), kind:"reminder-batch", at:Date.now(), count:n, body: fill(S.settings.templates.reminder, {first_name:"{first name}"})});
    save(); render(); toast("Reminders sent", n + " customers got tonight's pickup reminder (demo).");
  },
  "driver-login"(el){ S.driverId = el.dataset.id; save(); render(); window.scrollTo(0,0); },
  "driver-logout"(){ S.driverId = null; pendingPhoto = null; save(); location.hash = "#driver"; render(); window.scrollTo(0,0); },
  "start-route"(el){
    const rt = R(el.dataset.id); const c = routeCounts(rt);
    if(c.new && !rt.bucketsLoaded){ toast("Load the new buckets first", "Check them off at the top.", "alert"); return; }
    rt.status = "active"; rt.startedAt = Date.now();
    const drv = S.drivers[rt.driverId];
    if(S.settings.onTheWay === "all"){ rt.stops.forEach(x => sendText("onway", x.cid, drv)); toast("Route started", "On-the-way text sent to all " + rt.stops.length + " customers."); }
    else { const first = rt.stops[0]; sendText("onway", first.cid, drv); toast("Route started", "Texted " + S.customers[first.cid].name + ": " + firstName(drv.name) + " is on the way."); }
    save(); render(); window.scrollTo(0,0);
  },
  "take-photo"(){ $("#photo-input").click(); },
  "sample-photo"(el){ pendingPhoto = {cid: el.dataset.cid, photo:{kind:"sample", seed: Math.floor(Math.random()*100000)}}; render(); },
  "jump-stop"(el){
    const rt = R(el.dataset.id); const i = rt.stops.findIndex(x => x.cid === el.dataset.cid); const cur = rt.stops.findIndex(x => x.status === "pending");
    if(i < 0 || cur < 0 || i === cur) return;
    const [stp] = rt.stops.splice(i, 1); rt.stops.splice(cur, 0, stp); pendingPhoto = null;
    if(S.settings.onTheWay === "next") { sendText("onway", stp.cid, S.drivers[rt.driverId]); toast("Changed next stop", "Texted " + S.customers[stp.cid].name + " that you're on the way."); }
    save(); render(); window.scrollTo(0,0);
  },
  "complete-stop"(el){
    const rt = R(el.dataset.id); const stp = rt.stops.find(x => x.cid === el.dataset.cid);
    if(!pendingPhoto || pendingPhoto.cid !== stp.cid) return;
    stp.status = "done"; stp.doneAt = Date.now(); stp.photo = pendingPhoto.photo; pendingPhoto = null;
    const drv = S.drivers[rt.driverId]; const cu = S.customers[stp.cid];
    sendText(stp.type === "new" ? "dropoff" : stp.type === "final" ? "final" : "serviced", stp.cid, drv, stp.photo);
    const next = rt.stops.find(x => x.status === "pending");
    if(next && S.settings.onTheWay === "next") sendText("onway", next.cid, drv);
    save(); render(); window.scrollTo(0,0);
    toast("Texted " + cu.name, (stp.type === "new" ? "New bucket dropped off" : stp.type === "final" ? "Final pickup done" : "Bucket serviced") + ", with the photo." + (next && S.settings.onTheWay === "next" ? " Next customer told you're on the way." : ""));
  },
  "skip-stop"(el){
    const rt = R(el.dataset.id), cid = el.dataset.cid, cu = S.customers[cid];
    openDrawer(`<div class="drawer-head"><h2>Couldn't service ${esc(firstName(cu.name))}</h2><button class="btn ghost sm" type="button" data-act="close-drawer" aria-label="Close">${ic("x")}</button></div>
    <form class="drawer-body" data-form="skip" data-id="${rt.id}" data-cid="${cid}" id="skip-form">
      <p class="hint">Yusuf gets a note right away. The customer is not texted.</p>
      ${["Bucket wasn't out","Couldn't get through the gate","Dog loose in the yard","Other"].map((r, i) => `<label class="radio-row"><input type="radio" name="reason" value="${r}" ${i===0?"checked":""}><b>${r}</b></label>`).join("")}
      <div class="field"><label for="sk-note">Note (optional)</label><textarea class="textarea" id="sk-note" name="note" placeholder="Anything Yusuf should know"></textarea></div>
    </form>
    <div class="drawer-foot"><button class="btn" type="button" data-act="close-drawer">Cancel</button><button class="btn primary" type="submit" form="skip-form">Skip stop</button></div>`);
  },
  "end-route"(el){
    const rt = R(el.dataset.id); if(!rt.facilityDone) return;
    rt.status = "done"; rt.endedAt = Date.now();
    const c = routeCounts(rt), drv = S.drivers[rt.driverId];
    const livePhotos = rt.stops.filter(x => x.photo).map(x => ({photo: x.photo, cid: x.cid, at: x.doneAt}));
    S.confirmations.push({id:uid(), routeId:rt.id, routeName:rt.name, driverId:rt.driverId, date:Date.now(), endedAt:rt.endedAt, total:c.total, ok:c.done, issues:c.issue, miles: Math.round(routeMiles(S, rt)*10)/10, livePhotos: livePhotos.length > 24 ? livePhotos.slice(0, 24) : livePhotos});
    S.texts.push({id:uid(), kind:"owner", at:Date.now(), body: `${firstName(drv.name)} finished ${rt.name}: ${c.done} of ${c.total} serviced${c.issue ? ", " + c.issue + " couldn't be serviced" : ""}, ${fmtMi(routeMiles(S, rt))} mi, dumped at the facility.`});
    save(); render(); window.scrollTo(0,0);
  }
};
const CH = {
  assign(el){
    const rt = R(el.dataset.id); const before = routeMiles(S, rt);
    rt.driverId = el.value; optimizeRoute(S, rt); save(); render();
    toast("Route reassigned to " + firstName(S.drivers[el.value].name), "Now starts from " + (startPoint(S, el.value) === S.facility ? "the facility" : "their home") + ". " + fmtMi(routeMiles(S, rt)) + " mi (was " + fmtMi(before) + ").", "swap");
  },
  "stop-type"(el){ const rt = R(el.dataset.id); const x = rt.stops.find(s => s.cid === el.dataset.cid); x.type = el.value; save(); render(); toast("Stop updated", S.customers[x.cid].name + ": " + TYPE[el.value].label, "flag"); },
  "buckets-loaded"(el){ R(el.dataset.id).bucketsLoaded = el.checked; save(); render(); },
  "facility-done"(el){ R(el.dataset.id).facilityDone = el.checked; save(); render(); },
  "reminder-on"(el){ S.settings.reminderOn = el.checked; save(); toast(el.checked ? "Reminders on" : "Reminders off", el.checked ? "Going out at " + fmtClock(S.settings.reminderTime) + " the night before." : "No reminder texts will go out.", "clock"); },
  "reminder-time"(el){ S.settings.reminderTime = el.value; save(); toast("Reminder time saved", "Texts go out at " + fmtClock(el.value) + " the night before.", "clock"); },
  otw(el){ S.settings.onTheWay = el.value; save(); toast("Saved", el.value === "next" ? "Customers are texted as the driver heads to them." : "Every customer is texted when the route starts.", "chat"); }
};
const FORMS = {
  customer(form){
    const fd = new FormData(form); const cid = form.dataset.cid;
    const isNew = !cid; const id = cid || ("c" + uid());
    const prev = S.customers[id];
    const routeId = fd.get("routeId") || (prev && prev.routeId);
    const c = prev ? {...prev} : {id, lat:0, lng:0};
    c.name = String(fd.get("name")).trim(); c.phone = String(fd.get("phone")).trim(); c.address = String(fd.get("address")).trim(); c.city = String(fd.get("city")).trim() || "Las Vegas";
    c.gate = String(fd.get("gate")).trim(); c.notes = String(fd.get("notes")).trim(); c.freq = fd.get("freq");
    const type = fd.get("type") || null;
    if(isNew || !prev.lat){ const rt = R(routeId); const pts = rt.stops.map(x => S.customers[x.cid]); const cx = pts.reduce((a,p) => a + p.lat, 0)/pts.length || 36.1, cy = pts.reduce((a,p) => a + p.lng, 0)/pts.length || -115.2; c.lat = cx + (Math.random()-0.5)*0.03; c.lng = cy + (Math.random()-0.5)*0.04; }
    if(prev && prev.routeId !== routeId){ const old = R(prev.routeId); if(old) old.stops = old.stops.filter(x => x.cid !== id); }
    c.routeId = routeId; S.customers[id] = c;
    const rt = R(routeId); let stop = rt.stops.find(x => x.cid === id);
    if(!stop){ stop = {cid:id, type: type || "new", status:"pending", photo:null, doneAt:null, issue:null}; rt.stops.push(stop); optimizeRoute(S, rt); }
    else if(type && stop.status === "pending") stop.type = type;
    save(); closeDrawer(); render();
    toast(isNew ? "Customer added" : "Saved", isNew ? c.name + " added to " + rt.name + (stop.type === "new" ? ", flagged as a new bucket drop-off." : ".") : c.name + " updated.", "check");
  },
  driver(form){
    const fd = new FormData(form); const d = S.drivers[form.dataset.id];
    const kind = fd.get("kind");
    if(kind === "home"){
      const lat = parseFloat(fd.get("lat")), lng = parseFloat(fd.get("lng"));
      if(!isFinite(lat) || !isFinite(lng)){ toast("Place the start on the map", "Tap the map where they start from.", "pin"); return; }
      d.start = {kind:"home", address: String(fd.get("address")).trim() || "Pinned location", city: String(fd.get("city")).trim() || "Las Vegas", lat, lng};
    } else d.start = {kind:"facility"};
    const changed = [];
    S.routeList.map(R).filter(rt => rt.driverId === d.id && rt.status === "ready").forEach(rt => { optimizeRoute(S, rt); changed.push(rt.name + " now " + fmtMi(routeMiles(S, rt)) + " mi"); });
    save(); closeDrawer(); render();
    toast("Start location saved", changed.length ? changed.join(" · ") : "Future routes will start here.", "pin");
  },
  route(form){
    const fd = new FormData(form); const ids = fd.getAll("stops");
    if(!ids.length){ toast("Pick at least one stop", "", "alert"); return; }
    const id = "r" + uid();
    const rt = {id, name: String(fd.get("name")).trim(), driverId: fd.get("driverId"), status:"ready", bucketsLoaded:false, facilityDone:false, startedAt:null, endedAt:null, stops:[]};
    ids.forEach(cid => { const c = S.customers[cid]; const old = R(c.routeId); let st = {type:"regular"}; if(old){ st = old.stops.find(x => x.cid === cid) || st; old.stops = old.stops.filter(x => x.cid !== cid); } c.routeId = id; rt.stops.push({cid, type: st.type || "regular", status:"pending", photo:null, doneAt:null, issue:null}); });
    S.routes[id] = rt; S.routeList.push(id); optimizeRoute(S, rt);
    S.routeList.map(R).forEach(r => { if(r.status === "ready" && r.id !== id) optimizeRoute(S, r); });
    save(); closeDrawer(); location.hash = "#route-" + id;
    toast("Route created", rt.stops.length + " stops · " + fmtMi(routeMiles(S, rt)) + " mi", "routes");
  },
  rename(form){ const rt = R(form.dataset.id); rt.name = String(new FormData(form).get("name")).trim() || rt.name; save(); closeDrawer(); render(); },
  "add-stops"(form){
    const rt = R(form.dataset.id); const ids = new FormData(form).getAll("stops");
    if(!ids.length){ closeDrawer(); return; }
    ids.forEach(cid => { const c = S.customers[cid]; const old = R(c.routeId); let st = {type:"regular"}; if(old){ st = old.stops.find(x => x.cid === cid) || st; old.stops = old.stops.filter(x => x.cid !== cid); if(old.status === "ready") optimizeRoute(S, old); } c.routeId = rt.id; rt.stops.push({cid, type: st.type || "regular", status:"pending", photo:null, doneAt:null, issue:null}); });
    optimizeRoute(S, rt); save(); closeDrawer(); render();
    toast(ids.length + " stop" + (ids.length>1?"s":"") + " added", rt.name + " is now " + fmtMi(routeMiles(S, rt)) + " mi", "routes");
  },
  skip(form){
    const fd = new FormData(form); const rt = R(form.dataset.id); const stp = rt.stops.find(x => x.cid === form.dataset.cid);
    stp.status = "issue"; stp.issue = fd.get("reason"); stp.doneAt = Date.now(); pendingPhoto = null;
    const cu = S.customers[stp.cid], drv = S.drivers[rt.driverId], note = String(fd.get("note") || "").trim();
    S.texts.push({id:uid(), kind:"issue", at:Date.now(), body:`${firstName(drv.name)} couldn't service ${cu.name} (${cu.address}): ${stp.issue}${note ? ". " + note : ""}`});
    const next = rt.stops.find(x => x.status === "pending");
    if(next && S.settings.onTheWay === "next") sendText("onway", next.cid, drv);
    save(); closeDrawer(); render(); window.scrollTo(0,0);
    toast("Stop skipped", "Yusuf got a note: " + stp.issue + ".", "alert");
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.tagName === "A" && el.getAttribute("href") && !el.getAttribute("href").startsWith("#")) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener("change", e => { const el = e.target.closest("[data-change]"); if(el && CH[el.dataset.change]) CH[el.dataset.change](el, e); });
document.addEventListener("submit", e => { const f = e.target.closest("[data-form]"); if(!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
document.addEventListener("input", e => {
  const el = e.target.closest("[data-input]"); if(!el) return;
  if(el.dataset.input === "cust-search"){
    custQuery = el.value;
    const q = custQuery.toLowerCase();
    const list = Object.values(S.customers).filter(c => (custFilter === "all" || c.routeId === custFilter) && (c.name + " " + c.address + " " + c.phone + " " + c.city).toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
    $("#cust-list").innerHTML = custRows(list);
  }
  if(el.dataset.input === "tpl"){
    S.settings.templates[el.dataset.key] = el.value; save();
    const ex = S.customers[Object.keys(S.customers)[0]];
    const pv = $("#pv-" + el.dataset.key); if(pv) pv.textContent = fill(el.value, {first_name: firstName(ex.name), driver_name:"Marcus", photo_link: photoLink({kind:"sample", seed:42})});
  }
});
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeDrawer(); $$(".lightbox").forEach(l => l.remove()); } });
$("#photo-input").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
  const rt = driverRoute(); if(!rt) return; const x = rt.stops.find(s => s.status === "pending"); if(!x) return;
  try{ const src = await processUpload(f, stampFor(S, x.cid, Date.now())); pendingPhoto = {cid:x.cid, photo:{kind:"data", src, id: uid()}}; render(); }
  catch(err){ toast("Couldn't read that photo", "Try again, or use the sample photo.", "alert"); }
});
window.addEventListener("hashchange", () => { closeDrawer(); render(); window.scrollTo(0, 0); });
window.addEventListener("storage", ev => { if(ev.key === KEY){ load(); render(); } });
render();
})();
</script>
</body>
</html>
